---
apiVersion: v1
kind: Service
metadata:
  name: app-msk-pg-lb
  namespace: postgres
  labels:
    app: app-msk-pg
spec:
  type: LoadBalancer
  # По умолчанию IP выделяет провайдер.
  # Для заранее выделенного адреса раскомментируйте и замените <IP>.
  # loadBalancerIP: <IP>
  selector:
    cnpg.io/poolerName: app-msk-rw
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
