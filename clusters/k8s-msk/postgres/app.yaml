---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-app
  namespace: flux-system
spec:
  interval: 5m
  path: "./clusters/k8s-msk/postgres/app"
  targetNamespace: postgres
  dependsOn:
    - name: cnpg-system-operator
    - name: cnpg-system-plugin
    - name: longhorn
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
