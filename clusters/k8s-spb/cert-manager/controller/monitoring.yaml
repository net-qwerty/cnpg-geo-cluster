---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: cert-manager
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: cert-manager
    app.kubernetes.io/name: cert-manager
  name: cert-manager
spec:
  endpoints:
    - interval: 60s
      path: /metrics
      scrapeTimeout: 30s
      port: http-metrics
      metricRelabelings:
        - action: labeldrop
          regex: (endpoint)
        - action: labeldrop
          regex: (service)
  jobLabel: cert-manager
  namespaceSelector: {}
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/name: cert-manager
