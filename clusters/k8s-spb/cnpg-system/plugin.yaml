---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-system-plugin
  namespace: flux-system
spec:
  interval: 5m
  timeout: 15m
  dependsOn:
    - name: cert-manager
    - name: cnpg-system-operator
  path: "./clusters/k8s-spb/cnpg-system/plugin"
  targetNamespace: cnpg-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: plugin-barman-cloud
      namespace: cnpg-system
