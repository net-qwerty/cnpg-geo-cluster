---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
spec:
  interval: 10m
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.0
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      interval: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    replicaCount: 3
    image:
      repository: ghcr.io/cloudnative-pg/cloudnative-pg
      tag: 1.30.0
    crds:
      create: true
    config:
      data:
        CLUSTERS_ROLLOUT_DELAY: "30"
        INSTANCES_ROLLOUT_DELAY: "30"
