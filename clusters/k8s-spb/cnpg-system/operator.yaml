---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-system-operator
  namespace: flux-system
spec:
  interval: 5m
  timeout: 15m
  path: "./clusters/k8s-spb/cnpg-system/operator"
  targetNamespace: cnpg-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg
      namespace: cnpg-system
